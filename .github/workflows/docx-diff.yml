# docx-validate Validator Diff — branch-over-branch validator-result regression.
#
# docx-validate is a validator, not a converter, so its regression analog of a
# "DOCX diff" is the stability of its OWN verdicts: run `validate()` over a
# representative fixture set on BOTH the merge base and the PR branch, then diff
# each fixture's result (valid flag + per-issue-code counts). A drift means a
# validator changed what it flags.
name: docx-validate Validator Diff Report
on:
  pull_request:
    branches:
      - main

jobs:
  validator-diff:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write # post the find-or-update PR comment
      contents: read
    steps:
      - name: Checkout base branch (merge base)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline

      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          path: current

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies (baseline)
        working-directory: baseline
        run: bun install --frozen-lockfile

      - name: Install dependencies (current)
        working-directory: current
        run: bun install --frozen-lockfile

      # The harness is new in the PR; seed it into the base checkout so the SAME
      # fixtures run against base's validator source. (The fixtures themselves are
      # pre-existing and present on both branches.)
      - name: Seed diff harness into baseline
        run: |
          cp current/scripts/validate-diff.ts baseline/scripts/validate-diff.ts
          cp current/scripts/validate-diff-fixtures.json baseline/scripts/validate-diff-fixtures.json

      - name: Snapshot validator verdicts (baseline)
        working-directory: baseline
        run: node --import tsx scripts/validate-diff.ts build --out ../base-verdicts.json

      - name: Snapshot validator verdicts (current)
        working-directory: current
        run: node --import tsx scripts/validate-diff.ts build --out ../cur-verdicts.json

      - name: Run validator-result diff
        id: diff
        working-directory: current
        run: |
          node --import tsx scripts/validate-diff.ts report \
            --baseline ../base-verdicts.json \
            --current ../cur-verdicts.json \
            --output ../diff-report.md || echo "diff_failed=true" >> "$GITHUB_OUTPUT"

      - name: Post validator diff report as PR comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let report;
            try {
              report = fs.readFileSync('diff-report.md', 'utf8');
            } catch {
              report = '# 🔎 docx-validate Validator Diff Report\n\n⚠️ The diff harness did not produce a report (build step likely failed). Check the job logs.';
            }
            const marker = 'docx-validate Validator Diff Report';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.data.find(c => c.user.type === 'Bot' && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body: report });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body: report });
            }

      - name: Upload validator diff artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docx-validate-validator-diff
          path: |
            base-verdicts.json
            cur-verdicts.json
            diff-report.md
          retention-days: 30

      - name: Fail on validator drift
        if: steps.diff.outputs.diff_failed == 'true'
        run: |
          echo "::error::Validator verdict drift detected between base and PR. Review the diff report comment / artifact."
          exit 1
