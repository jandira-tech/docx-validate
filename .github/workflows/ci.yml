name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

permissions:
    contents: read

jobs:
    test:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                # 24 = previous default, 26 = current target. The native
                # libxmljs2 addon blocked 26 (no ABI-147 prebuild, source
                # build fails against its V8 headers); the libxml2-wasm
                # cutover removed that constraint.
                node-version: ["24", "26"]
        steps:
            - uses: actions/checkout@v5

            # pnpm MUST be on PATH before setup-node resolves `cache: pnpm`
            # (it shells out to `pnpm store path`), otherwise the job dies
            # with "Unable to locate executable file: pnpm".
            - uses: pnpm/action-setup@v4
              # version comes from the packageManager field in package.json

            - uses: actions/setup-node@v5
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Type-check
              run: pnpm exec tsc --noEmit

            - name: Lint
              run: pnpm run lint:fix

            - name: Format check
              run: pnpm run fmt:fix

            - name: Test
              run: pnpm exec vitest run --coverage

            - name: Upload coverage to Codecov
              uses: codecov/codecov-action@v5
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
                  files: ./coverage/lcov.info
                  fail_ci_if_error: false
                  verbose: true

            - name: Build
              run: pnpm run build
