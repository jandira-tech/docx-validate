name: Publish to npm

on:
    release:
        types: [published]
    workflow_dispatch:
        inputs:
            tag:
                description: "Existing release tag matching package.json, for example v0.53.0-rc.1"
                required: true
                type: string

permissions:
    contents: read

concurrency:
    group: npm-publish-${{ github.event.release.tag_name || inputs.tag }}
    cancel-in-progress: false

jobs:
    publish:
        runs-on: ubuntu-latest
        environment: npm-publish
        permissions:
            contents: read
            id-token: write
        env:
            RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
            RELEASE_KIND: ${{ github.event_name == 'release' && (github.event.release.prerelease && 'prerelease' || 'stable') || '' }}
        steps:
            - uses: actions/checkout@v5
              with:
                  ref: ${{ github.event.release.tag_name || inputs.tag }}
                  persist-credentials: false

            - uses: actions/setup-node@v5
              with:
                  node-version: "24"
                  registry-url: "https://registry.npmjs.org"
                  package-manager-cache: false

            - uses: pnpm/action-setup@v4
              with:
                  cache: false

            - name: Use npm with trusted publishing support
              run: npm install --global npm@latest

            - name: Install dependencies without a release cache
              run: pnpm install --frozen-lockfile

            - name: Verify version, tests, build, and package contents
              id: preflight
              run: pnpm run release:check

            - name: Publish through npm trusted publishing
              env:
                  NPM_DIST_TAG: ${{ steps.preflight.outputs.dist_tag }}
              run: npm publish --provenance --access public --tag "$NPM_DIST_TAG"
