name: Jules PR Reviewer
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  pull-requests: write
  contents: read
  statuses: write
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Jules PR Reviewer
        uses: sanjay3290/jules-pr-reviewer@d7c30164dbcb5be7bbec0e9d6bc709cbdb8f62fa # v1.1.0
        with:
          jules_api_key: ${{ secrets.JULES_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          fail_on: blocking
